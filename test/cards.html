<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        .product-card {
            position: relative;
            overflow: hidden;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            transition: opacity 0.3s ease;
        }
        .product-card .hover-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
        }
        .product-card:hover .hover-image {
            opacity: 1;
        }
        .product-card .product-actions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .product-card:hover .product-actions {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-3">
                <div class="product-card">
                    <img src="image1.jpg" class="main-image" alt="Product Image">
                    <img src="image2.jpg" class="hover-image" alt="Hover Image">
                    <h5 class="mt-2">Product Name</h5>
                    <p><strong>₹1,299</strong> <del>₹5,995</del></p>
                    <div class="product-actions">
                        <button class="btn btn-primary btn-sm">Add to Cart</button>
                        <button class="btn btn-outline-danger btn-sm"><i class="fas fa-heart"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
