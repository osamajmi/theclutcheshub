<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .cart-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .cart-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }
        .cart-item img {
            width: 80px;
            border-radius: 5px;
            margin-right: 15px;
        }
        .price {
            font-size: 18px;
            font-weight: bold;
            color: #a14892;
        }
        .quantity-box {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        .quantity-box button {
            background: #a14892;
            color: white;
            border: none;
            padding: 5px 10px;
        }
        .checkout-btn {
            background: #a14892;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
        }
        .accordion-button {
            background-color: #1f4a63 !important;
            color: white !important;
        }
        .offer-box {
            background: #f5e6d7;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .total-amount {
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="cart-container mt-5">
    <h4 class="mb-3">Shopping Cart</h4>

    <!-- Available Offers Section -->
    <div class="accordion" id="offerAccordion">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#offerCollapse">
                    Available Offers
                </button>
            </h2>
            <div id="offerCollapse" class="accordion-collapse collapse">
                <div class="accordion-body">
                    <div class="offer-box">
                        <h5>Last Few Hours - Women's Day Sale <br> <strong>BOGO Sale</strong></h5>
                        <p>Add 2 Products in cart to avail the offer.</p>
                        <ul>
                            <li>Slings BOGO</li>
                            <li>Wallet BOGO</li>
                            <li>Offer cannot be combined with other discounts.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Product 1 -->
    <div class="cart-item">
        <img src="https://via.placeholder.com/80" alt="Product">
        <div class="flex-grow-1">
            <h5>FloMotif Classic Zipper Wallet</h5>
            <div class="price">₹<span class="unit-price">1099</span>.00</div>
        </div>
        <div class="quantity-box">
            <button class="decrease">-</button>
            <input type="text" class="form-control text-center quantity" value="1" style="width: 40px; border: none;">
            <button class="increase">+</button>
        </div>
    </div>

    <!-- Product 2 -->
    <div class="cart-item">
        <img src="https://via.placeholder.com/80" alt="Product">
        <div class="flex-grow-1">
            <h5>Lattice Lace Women's Office Bag</h5>
            <div class="price">₹<span class="unit-price">1698.90</span></div>
        </div>
        <div class="quantity-box">
            <button class="decrease">-</button>
            <input type="text" class="form-control text-center quantity" value="1" style="width: 40px; border: none;">
            <button class="increase">+</button>
        </div>
    </div>

    <!-- Total Amount Section -->
    <div class="total-amount">Total: ₹<span id="totalAmount">2797.90</span></div>

    <!-- Checkout Button -->
    <button class="checkout-btn mt-3">Proceed to Checkout</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function updateTotal() {
        let total = 0;
        document.querySelectorAll(".cart-item").forEach((item) => {
            let price = parseFloat(item.querySelector(".unit-price").textContent);
            let quantity = parseInt(item.querySelector(".quantity").value);
            total += price * quantity;
        });
        document.getElementById("totalAmount").textContent = total.toFixed(2);
    }

    document.querySelectorAll(".increase").forEach((btn) => {
        btn.addEventListener("click", function () {
            let input = this.previousElementSibling;
            input.value = parseInt(input.value) + 1;
            updateTotal();
        });
    });

    document.querySelectorAll(".decrease").forEach((btn) => {
        btn.addEventListener("click", function () {
            let input = this.nextElementSibling;
            if (parseInt(input.value) > 1) {
                input.value = parseInt(input.value) - 1;
                updateTotal();
            }
        });
    });

    window.onload = updateTotal;
</script>

</body>
</html>
