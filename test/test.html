<body>
    <div class="container mt-4">
        <h3 class="fw-bold text-dark text-center">
            <span style="color: #ff9800;">•</span> Related Products  <span style="color: #ff9800;">•</span>
        </h3>
        <div class="owl-carousel product-carousel">
            <div class="item">
                <div class="mainCard">
                    <div class="Mainproduct-card">
                        <img src="../image/pro3.webp" class="main-image" alt="Product Image">
                        <img src="../image/pro2.webp" class="hover-image" alt="Hover Image">
                        <div class="product-actions">
                            <a href="./productDetail.html"><button class="btn-cart">Add to Cart</button></a>    
                        </div>
                        <div class="product-actions product-actionsIcon">
                            <button class="iconsHeart"><i class="fas fa-heart"></i></button>
                        </div>
                    </div>
                    <h5 class="mt-2 proName">Fiesta Finery Party Clutch</h5>
                    <p class="pricePro"><strong>₹1,299</strong> <del>₹5,995</del></p>
                </div>
            </div>
            <!-- Duplicate the above div.item structure for more products -->
        </div>
    </div>

    <script>
    $(document).ready(function(){
        $(".product-carousel").owlCarousel({
            loop:true,
            margin:10,
            nav:true,
            responsive:{
                0:{ items:2 },
                600:{ items:3 },
                1000:{ items:6 }
            }
        });
    });
    </script>
</body>
